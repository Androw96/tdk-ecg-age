[theme]
base = "light"
primaryColor = "#087f83"
backgroundColor = "#f5f7fa"
secondaryBackgroundColor = "#ffffff"
textColor = "#162d3d"
font = "sans serif"

[server]
# A helyi indító (launch_dashboard.command) --server.address=127.0.0.1 kapcsolóval csak a
# saját gépen figyel; az address itt szándékosan nincs rögzítve, hogy a felhős telepítés is működjön.
headless = true
maxUploadSize = 100

[browser]
gatherUsageStats = false
